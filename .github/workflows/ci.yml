name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config JSON parses
        run: jq empty reference/opencode.template.json

      - name: Scripts parse
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
