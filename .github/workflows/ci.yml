name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Config JSON parses
        run: jq empty reference/opencode.template.json

      - name: Scripts parse
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Bundled skill integrity
        run: python3 scripts/validate-skills.py

      - name: Validator tests
        run: python3 -m unittest discover -s tests -v
      - name: Native RTK plugin tests
        run: node --test runtime/rtk/opencode/rtk.test.mjs
